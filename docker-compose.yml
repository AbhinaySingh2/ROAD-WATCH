version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/roadwatch.db:/app/roadwatch.db
    env_file:
      - ./backend/.env
    environment:
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
